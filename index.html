<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rolling 7-Day Checklist</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-border: #333333;
            --today-border: #38bdf8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
            font-weight: bold;
            font-size: 16px;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }

        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .day-card.today {
            border: 2px solid var(--today-border);
        }

        .day-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
            color: #fff;
        }

        .today-badge {
            background-color: var(--accent);
            color: #121212;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            flex-grow: 1;
        }

        .task-item {
            display: flex;
            align-items: center;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .task-item input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--accent);
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .add-task-row {
            display: flex;
            gap: 5px;
            margin-top: auto;
        }

        .add-task-row input {
            flex-grow: 1;
            background: #121212;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        .add-task-row button {
            background: var(--accent);
            border: none;
            color: #121212;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="header-bar">
    <span>My Rolling Weekly To-Do List</span>
    <span id="date-display"></span>
</div>

<div class="schedule-grid" id="rolling-container">
    <!-- Generated dynamically via JavaScript -->
</div>

<script>
    // Header date display
    const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
    const today = new Date();
    document.getElementById('date-display').innerText = today.toLocaleDateString('en-US', options);

    const container = document.getElementById('rolling-container');

    // Generate the next 7 days starting from today
    for (let i = 0; i < 7; i++) {
        const currentDate = new Date();
        currentDate.setDate(today.getDate() + i);

        // Format date key for local storage (e.g., "2026-09-10")
        const dateKey = currentDate.toISOString().split('T')[0];
        const displayDateStr = currentDate.toLocaleDateString('en-US', { weekday: 'long', month: 'numeric', day: 'numeric' });
        const isToday = (i === 0);

        let cardHtml = `
            <div class="day-card ${isToday ? 'today' : ''}" id="card-${dateKey}">
                <div class="day-title-bar">
                    <span>${displayDateStr}</span>
                    ${isToday ? '<span class="today-badge">Today</span>' : ''}
                </div>
                <ul class="task-list" id="list-${dateKey}">
                    <!-- Tasks injected here -->
                </ul>
                <div class="add-task-row">
                    <input type="text" id="input-${dateKey}" placeholder="Add task..." onkeypress="handleKeypress(event, '${dateKey}')">
                    <button onclick="addTask('${dateKey}')">Add</button>
                </div>
            </div>
        `;
        container.innerHTML += cardHtml;
        loadTasks(dateKey);
    }

    function loadTasks(dateKey) {
        const listEl = document.getElementById(`list-${dateKey}`);
        listEl.innerHTML = '';
        const savedTasks = JSON.parse(localStorage.getItem(`tasks_${dateKey}`)) || [];

        savedTasks.forEach((task, index) => {
            let li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'completed' : ''}`;
            li.innerHTML = `
                <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask('${dateKey}', ${index})">
                <span>${escapeHtml(task.text)}</span>
            `;
            listEl.appendChild(li);
        });
    }

    function addTask(dateKey) {
        const inputEl = document.getElementById(`input-${dateKey}`);
        const text = inputEl.value.trim();
        if (!text) return;

        let savedTasks = JSON.parse(localStorage.getItem(`tasks_${dateKey}`)) || [];
        savedTasks.push({ text: text, completed: false });
        localStorage.setItem(`tasks_${dateKey}`, JSON.stringify(savedTasks));

        inputEl.value = '';
        loadTasks(dateKey);
    }

    function toggleTask(dateKey, index) {
        let savedTasks = JSON.parse(localStorage.getItem(`tasks_${dateKey}`)) || [];
        savedTasks[index].completed = !savedTasks[index].completed;
        localStorage.setItem(`tasks_${dateKey}`, JSON.stringify(savedTasks));
        loadTasks(dateKey);
    }

    function handleKeypress(event, dateKey) {
        if (event.key === 'Enter') {
            addTask(dateKey);
        }
    }

    function escapeHtml(string) {
        return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
